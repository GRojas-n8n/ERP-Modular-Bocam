# ============================================================
# deploy-vps-rls-apply.yml — BocamOS ERP
#
# Aplica un rls-policies.sql contra la base de datos REAL de
# producción de un microservicio. Disparo manual únicamente
# (workflow_dispatch) — a diferencia de deploy-vps-caddy.yml, esto
# no debe correr automáticamente en cada push que toque el archivo:
# es una operación deliberada sobre políticas de acceso a datos
# reales, no una config de proxy sin estado.
#
# `prisma db execute` (rol de runtime `bocam_app`) NO alcanza: tras el
# hardening de openspec: fix-rls-bypass-bocam-admin, ese rol no es
# superusuario ni dueño de las funciones/políticas — falla con "must be
# owner of function current_tenant_id". Se aplica como superusuario
# (contenedor `postgres`, rol POSTGRES_USER) vía
# scripts/ci/apply-rls-as-admin.sh, que resuelve el nombre real de la base
# del servicio a partir de su propio DATABASE_URL sin necesitar conocer ni
# exponer credenciales de producción en este workflow.
#
# El script es idempotente (`DROP POLICY IF EXISTS` + `CREATE POLICY`,
# `CREATE OR REPLACE FUNCTION`), así que correrlo dos veces no rompe
# nada — pero solo debe correrse cuando el archivo en el repo es
# exactamente el que se quiere aplicar.
#
# SECRETS requeridos (los mismos que los otros workflows de deploy):
#   VPS_SSH_KEY, VPS_HOST, VPS_USER
# ============================================================

name: Aplicar RLS al VPS (manual)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Servicio (finanzas, contabilidad o auth)"
        required: true
        type: choice
        options:
          - finanzas
          - contabilidad
          - auth

env:
  VPS_REPO_PATH: /root/ERP-Modular-Bocam

jobs:
  apply-rls:
    name: Aplicar rls-policies.sql (${{ inputs.service }})
    runs-on: ubuntu-latest

    steps:
      # ── 1. Configurar SSH ──────────────────────────────────
      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── 2. Actualizar el repo en el VPS ─────────────────────
      - name: Git pull en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && git fetch origin main && git merge --ff-only origin/main"

      # ── 3. Aplicar el script como superusuario ──────────────
      - name: Aplicar rls-policies.sql (superusuario)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && bash scripts/ci/apply-rls-as-admin.sh ${{ inputs.service }}"

      # ── 4. Confirmar que las políticas quedaron activas ─────
      - name: Verificar políticas RLS aplicadas
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && bash scripts/ci/verify-rls-policies.sh ${{ inputs.service }}"

      # ── 5. Resumen ───────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          echo "=================================="
          echo "RLS aplicado: ${{ inputs.service }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=================================="
