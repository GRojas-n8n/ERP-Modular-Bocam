# ============================================================
# deploy-vps-caddy.yml — BocamOS ERP
# Dispara en cada push a main que toque docker/Caddyfile.
#
# Ni deploy-vps.yml (frontend) ni deploy-vps-backend.yml tocan el
# contenedor `caddy` — solo reconstruyen app-shell/los microservicios.
# Un cambio en el Caddyfile (ej. openspec: hardening-headers-http-caddy)
# quedaba comiteado en `main` sin llegar nunca a producción, porque
# nada le pedía a Caddy releer su configuración. Este workflow cierra
# ese hueco.
#
# `--force-recreate`, no `caddy reload`: el compose monta
# `./docker/Caddyfile:/etc/caddy/Caddyfile:ro` como bind mount de un
# ARCHIVO individual, que Docker ata al inodo que existía al crear el
# contenedor. `git merge`/`checkout` reemplaza el archivo vía
# write-nuevo-archivo + rename (no lo edita in-place), así que el
# inodo cambia — el contenedor sigue viendo el contenido viejo para
# siempre sin importar cuántas veces se le pida `caddy reload`.
# Confirmado empíricamente 2026-08-20: `caddy reload` corría sin
# error, pero `md5sum` del archivo en el repo vs. el que veía el
# contenedor no coincidían, y el JSON adaptado adentro del contenedor
# ni siquiera tenía el bloque `header`. Recrear el contenedor es la
# única forma de que tome un bind mount fresco. Implica una
# desconexión breve (~1-2s) al liberar y volver a bindear :80/:443 —
# inevitable dado el problema real, no una regresión de este fix.
#
# SECRETS requeridos (los mismos que deploy-vps.yml / deploy-vps-backend.yml):
#   VPS_SSH_KEY, VPS_HOST, VPS_USER
# ============================================================

name: Deploy Caddy al VPS

on:
  push:
    branches:
      - main
    paths:
      - "docker/Caddyfile"
      - ".github/workflows/deploy-vps-caddy.yml"

  # Permite disparar manualmente desde la UI de GitHub Actions
  workflow_dispatch:

# Mismo grupo que deploy-vps.yml / deploy-vps-backend.yml: los tres
# hacen `git pull` sobre el mismo checkout del VPS y se serializan
# entre sí para no pisarse el working directory.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_REPO_PATH: /root/ERP-Modular-Bocam

jobs:
  deploy:
    name: Recrear contenedor Caddy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Configurar SSH ──────────────────────────────────
      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── 2. Actualizar el repo en el VPS ─────────────────────
      # Fast-forward only, igual que los otros dos workflows de deploy.
      - name: Git pull en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && git fetch origin main && git merge --ff-only origin/main"

      # ── 3. Recrear el contenedor con el bind mount fresco ──────
      # `up -d --force-recreate` en vez de `caddy reload`: ver
      # explicación arriba (bind mount de archivo atado al inodo viejo).
      - name: docker compose up -d --force-recreate caddy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && docker compose -f docker-compose.vps.yml up -d --force-recreate caddy"

      # ── 4. Confirmar que el contenedor nuevo cargó el Caddyfile correcto ──
      - name: Validar que el contenedor ve el Caddyfile actual del repo
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.VPS_REPO_PATH }} && sleep 2 && \
             REPO_MD5=\$(md5sum docker/Caddyfile | awk '{print \$1}') && \
             CONTAINER_MD5=\$(docker compose -f docker-compose.vps.yml exec -T caddy md5sum /etc/caddy/Caddyfile | awk '{print \$1}') && \
             echo \"repo: \$REPO_MD5 / contenedor: \$CONTAINER_MD5\" && \
             if [ \"\$REPO_MD5\" != \"\$CONTAINER_MD5\" ]; then echo 'ERROR: el contenedor sigue viendo un Caddyfile distinto al del repo'; exit 1; fi && \
             docker compose -f docker-compose.vps.yml exec -T caddy caddy validate --config /etc/caddy/Caddyfile"

      # ── 5. Verificar que los headers de seguridad quedaron activos ──
      - name: Verificar headers de seguridad
        run: |
          sleep 2
          HEADERS=$(curl -sI https://iretum.com/)
          echo "$HEADERS"
          for h in "Strict-Transport-Security" "X-Content-Type-Options" "X-Frame-Options" "Referrer-Policy" "Permissions-Policy"; do
            if ! echo "$HEADERS" | grep -qi "^$h:"; then
              echo "ERROR: falta el header $h en la respuesta de producción"
              exit 1
            fi
          done
          echo "OK: los 5 headers de seguridad están presentes en https://iretum.com"

      # ── 6. Notificación de resultado ───────────────────────
      - name: Resumen del deploy
        if: always()
        run: |
          echo "=================================="
          echo "Deploy de Caddy completado"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=================================="
