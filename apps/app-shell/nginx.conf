server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optimización: Caching de assets estáticos
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy → Auth
    location /api/v1/auth {
        proxy_pass http://auth:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy → Gerencia Técnica (insumos + presupuestos)
    location /api/v1/insumos {
        proxy_pass http://gerencia-tecnica:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Compras
    location /api/v1/compras {
        proxy_pass http://compras:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
        proxy_set_header x-user-id $http_x_user_id;
    }

    # Proxy → Finanzas
    location /api/v1/finanzas {
        proxy_pass http://finanzas:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Control de Obra
    location /api/v1/control-obra {
        proxy_pass http://control-obra:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Personal / RH
    location /api/v1/personal {
        proxy_pass http://personal:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Seguridad / HSE
    location /api/v1/seguridad {
        proxy_pass http://seguridad:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Calidad
    location /api/v1/calidad {
        proxy_pass http://calidad:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    # Proxy → Reportes Exportables
    location /api/v1/reportes {
        proxy_pass http://reportes:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Sin límite de body para reportes con datos grandes
        client_max_body_size 10m;
    }

    # Proxy → Ventas
    location /api/v1/ventas {
        proxy_pass http://ventas:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header x-tenant-id $http_x_tenant_id;
        proxy_set_header x-proyecto-id $http_x_proyecto_id;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
